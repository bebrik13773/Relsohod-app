name: Build Android APK (Рельсоход)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Kotlin APK & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js & sync tram network data
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync tram_network.json and WebView map bundle for Android assets
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          npm run android:sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Restore cached signing keystores
        uses: actions/cache@v4
        with:
          path: |
            android/release.keystore
            android/debug.keystore
          key: relsokhod-signing-keystores-v2
          restore-keys: |
            relsokhod-release-keystore-

      - name: Prepare signing keystores for Debug & Release APKs
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release.keystore
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          elif [ -f release.keystore ]; then
            echo "Reusing cached release keystore so APK upgrades preserve app data and signature."
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=relsokhod123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=relsokhod" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=relsokhod123" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias relsokhod \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass relsokhod123 \
              -keypass relsokhod123 \
              -dname "CN=Relsokhod, OU=Tram, O=Relsokhod, L=SPb, C=RU"
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=relsokhod123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=relsokhod" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=relsokhod123" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Relsokhod-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/Relsokhod-release.apk
          ls -lh dist-apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relsokhod-android-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Prepare GitHub Release metadata & notes
        if: github.event_name != 'pull_request'
        id: release_meta
        run: |
          VERSION_NAME="$(grep -E 'versionName[[:space:]]*=' android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="2.3.0-native"
          fi
          BASE_VER="${VERSION_NAME%%-*}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_NAME="🚋 Рельсоход ${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${BASE_VER}-build.${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="🚋 Рельсоход v${BASE_VER} (сборка #${GITHUB_RUN_NUMBER})"
          fi

          RELEASE_SIZE="$(du -h dist-apk/Relsokhod-release.apk | cut -f1)"
          DEBUG_SIZE="$(du -h dist-apk/Relsokhod-debug.apk | cut -f1)"
          RELEASE_SHA="$(sha256sum dist-apk/Relsokhod-release.apk | awk '{print $1}')"
          DEBUG_SHA="$(sha256sum dist-apk/Relsokhod-debug.apk | awk '{print $1}')"

          PREV_TAG="$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n1 || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMITS_RANGE="${PREV_TAG}..HEAD"
            COMMITS_TITLE="### 🧾 Коммиты с версии \`${PREV_TAG}\`"
          else
            COMMITS_RANGE="HEAD"
            COMMITS_TITLE="### 🧾 Последние коммиты"
          fi

          RECENT_CHANGES="$(git log ${COMMITS_RANGE} --no-merges -n 12 --pretty='- %s (`%h`)' 2>/dev/null || true)"
          if [ -z "$RECENT_CHANGES" ]; then
            RECENT_CHANGES="$(git log -n 6 --no-merges --pretty='- %s (`%h`)' 2>/dev/null || echo '- Сборка актуальной версии приложения')"
          fi

          MANUAL_CHANGELOG=""
          if [ -f CHANGELOG.md ]; then
            MANUAL_CHANGELOG="$(awk '/^## /{ if (seen++) exit; next } seen { print }' CHANGELOG.md | sed '/./,$!d')"
          fi
          if [ -z "$MANUAL_CHANGELOG" ]; then
            MANUAL_CHANGELOG="### ✨ Новое
          - Актуальная сборка нативного Android-приложения «Рельсоход»."
          fi

          cat <<EOF > release-notes.md
          # 🚋 Рельсоход ${TAG_NAME}

          > Нативный клиент (**Kotlin + Jetpack Compose**) для трамвайных и пеших прогулок по **Санкт-Петербургу** и **Омску**.

          ${MANUAL_CHANGELOG}

          ---

          ### 📦 Что скачать и как обновиться
          - ⭐ **\`Relsokhod-release.apk\`** (\`${RELEASE_SIZE}\`) — основная сборка для смартфонов (**Android 7.0 – 16**).
          - 🔄 Новые версии можно проверять, скачивать и открывать для установки **прямо внутри приложения** (баннер при старте или *Настройки → Обновления*).
          - 🔑 При самом первом переходе со старых сборок с временным ключом Android может попросить один раз удалить старую версию — далее единая подпись позволяет обновляться поверх с сохранением маршрутов.

          <details>
          <summary>🛠️ Детали сборки (\`${VERSION_NAME}\` · #${GITHUB_RUN_NUMBER}), отладочный APK (\`${DEBUG_SIZE}\`) и список коммитов</summary>

          - **Версия:** \`${VERSION_NAME}\`
          - **Сборка CI:** \`#${GITHUB_RUN_NUMBER}\` · коммит \`${SHORT_SHA}\`
          - **SHA-256 (\`Relsokhod-release.apk\`):** \`${RELEASE_SHA}\`
          - **SHA-256 (\`Relsokhod-debug.apk\`):** \`${DEBUG_SHA}\` (\`Relsokhod-debug.apk\` — для разработки и отладки)

          ${COMMITS_TITLE}
          ${RECENT_CHANGES}

          </details>
          EOF

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Publish APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          files: dist-apk/*.apk
          generate_release_notes: false
          make_latest: 'true'
          fail_on_unmatched_files: true
