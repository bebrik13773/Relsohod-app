name: Build Android APK (Рельсоход)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Kotlin APK & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js & sync tram network data
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync tram_network.json for Android assets
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm run android:sync
          else
            npx --yes tsx scripts/export-android-data.ts
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare signing keystore for Release APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release.keystore
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias relsokhod \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass relsokhod123 \
              -keypass relsokhod123 \
              -dname "CN=Relsokhod, OU=Tram, O=Relsokhod, L=SPb, C=RU"
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=relsokhod123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=relsokhod" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=relsokhod123" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Relsokhod-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/Relsokhod-release.apk
          ls -lh dist-apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relsokhod-android-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Prepare GitHub Release metadata
        if: github.event_name != 'pull_request'
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Рельсоход ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "tag_name=v2.0.0-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_name=Рельсоход — сборка #${GITHUB_RUN_NUMBER} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: dist-apk/*.apk
          generate_release_notes: true
          make_latest: 'true'
          fail_on_unmatched_files: true
