name: Build Android APK (Рельсоход)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Kotlin APK & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Node.js & sync tram network data
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync tram_network.json for Android assets
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm run android:sync
          else
            npx --yes tsx scripts/export-android-data.ts
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare signing keystore for Release APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release.keystore
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias relsokhod \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass relsokhod123 \
              -keypass relsokhod123 \
              -dname "CN=Relsokhod, OU=Tram, O=Relsokhod, L=SPb, C=RU"
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=relsokhod123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=relsokhod" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=relsokhod123" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Relsokhod-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/Relsokhod-release.apk
          ls -lh dist-apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relsokhod-android-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Prepare GitHub Release metadata & notes
        if: github.event_name != 'pull_request'
        id: release_meta
        run: |
          VERSION_NAME="$(grep -E 'versionName[[:space:]]*=' android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="2.1.0-native"
          fi
          BASE_VER="${VERSION_NAME%%-*}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_NAME="🚋 Рельсоход ${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${BASE_VER}-build.${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="🚋 Рельсоход v${BASE_VER} (сборка #${GITHUB_RUN_NUMBER})"
          fi

          RELEASE_SIZE="$(du -h dist-apk/Relsokhod-release.apk | cut -f1)"
          DEBUG_SIZE="$(du -h dist-apk/Relsokhod-debug.apk | cut -f1)"
          RELEASE_SHA="$(sha256sum dist-apk/Relsokhod-release.apk | awk '{print $1}')"
          DEBUG_SHA="$(sha256sum dist-apk/Relsokhod-debug.apk | awk '{print $1}')"
          RECENT_CHANGES="$(git log -n 8 --pretty='- %s (`%h`)' 2>/dev/null || echo '- Сборка актуальной версии приложения')"

          cat <<EOF > release-notes.md
          # 🚋 Рельсоход — нативное Android-приложение

          Умный маршрутизатор городских прогулок на трамваях, городском транспорте и пешком по **Санкт-Петербургу** и **Омску**. Полностью нативный клиент на **Kotlin + Jetpack Compose** (без WebView).

          ---

          ## 📦 Какой файл скачать

          | Файл | Назначение | Размер | Рекомендация |
          | --- | --- | --- | --- |
          | **\`Relsokhod-release.apk\`** | Основная релизная версия с R8-оптимизацией и подписью | \`${RELEASE_SIZE}\` | ⭐ **Скачивайте этот файл** |
          | **\`Relsokhod-debug.apk\`** | Отладочная сборка для тестирования и логов | \`${DEBUG_SIZE}\` | Для разработчиков |

          ---

          ## ✨ Что внутри этой версии (\`${VERSION_NAME}\`)

          - **⚡ Быстрый и плавный интерфейс**: парсинг сети, построение маршрутов, работа с фото и сохранение настроек выполняются в фоне; сглаженная карта и треугольный баланс работают без лагов.
          - **🛡️ Актуальная совместимость (Android 16 / API 36)**: поддержка системного фотопикера (*Privacy Photo Picker*) без лишних разрешений, правила резервного копирования и предиктивный жест «Назад».
          - **🔺 Треугольный регулятор баланса**: наглядная настройка соотношения **Трамваи / Транспорт / Пешком** с быстрыми пресетами.
          - **🗺️ Плавная схема и навигация**: сглаженные кривыми Безье линии с разведением по полосам, выбор точек на карте и экспорт готового маршрута в **Яндекс Карты**.
          - **🎙️ Режим «В пути», Паспорт и статистика**: автоинформатор, таймер пересадок, фотоальбом, достижения и сводная статистика по пройденным километрам и районам СПб в **Избранном**.

          ---

          ## 📲 Как установить на смартфон

          1. Раскройте блок **Assets** ниже и скачайте **\`Relsokhod-release.apk\`**.
          2. Откройте скачанный файл на телефоне (**Android 7.0 — Android 16**).
          3. При первой установке разрешите установку приложений из этого источника (браузера или проводника).

          ---

          <details>
          <summary>🛠️ Технические детали сборки и последние изменения</summary>

          - **Версия:** \`${VERSION_NAME}\`
          - **Сборка CI:** \`#${GITHUB_RUN_NUMBER}\` · коммит \`${SHORT_SHA}\`
          - **SHA-256 (\`Relsokhod-release.apk\`):** \`${RELEASE_SHA}\`
          - **SHA-256 (\`Relsokhod-debug.apk\`):** \`${DEBUG_SHA}\`

          ### Последние коммиты
          ${RECENT_CHANGES}

          </details>
          EOF

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Publish APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          files: dist-apk/*.apk
          generate_release_notes: false
          make_latest: 'true'
          fail_on_unmatched_files: true
